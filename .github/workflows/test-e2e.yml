name: E2E Tests

on:
  push:
  pull_request:

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: self-hosted-linux
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      # Go is baked into the self-hosted runner image; setup-go would download
      # a toolchain at job time (taskforge-2675). go.mod's go 1.24.6 is
      # satisfied by the newer baked Go.
      - name: Verify baked Go
        run: go version

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e
