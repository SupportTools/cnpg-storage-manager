name: E2E Tests

on:
  push:
  pull_request:

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: self-hosted-linux
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      # Go is baked into the self-hosted runner image; setup-go would download
      # a toolchain at job time (taskforge-2675). go.mod's go 1.24.6 is
      # satisfied by the newer baked Go.
      - name: Verify baked Go
        run: go version

      # kind is not baked into the runner image. Build a pinned version from
      # its Go module through the runner's GOPROXY (Athens) instead of curling
      # the unpinned kind.sigs.k8s.io/dl/latest binary (taskforge-2824).
      - name: Install kind (pinned, via GOPROXY)
        env:
          KIND_VERSION: v0.33.0
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e
