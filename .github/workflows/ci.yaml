name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # The cluster pulls from Harbor. Before cluster-services-1332 every build was copied in by hand
  # with crane. Own project (not supporttools), so this CI credential can overwrite nothing else.
  HARBOR_REGISTRY: harbor.support.tools
  HARBOR_IMAGE: harbor.support.tools/cnpg-storage-manager/cnpg-storage-manager

jobs:
  lint:
    name: Lint
    runs-on: self-hosted-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Go is baked into the self-hosted runner image; setup-go would download
      # a toolchain at job time (taskforge-2675). go.mod's go 1.24.6 is
      # satisfied by the newer baked Go.
      - name: Verify baked Go
        run: go version

      # golangci-lint is baked into the runner image (v2.12.2); the action
      # downloads it at job time (taskforge-2675).
      - name: Run golangci-lint
        run: golangci-lint version && golangci-lint run --timeout=5m

  test:
    name: Test
    runs-on: self-hosted-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Go is baked into the self-hosted runner image; setup-go would download
      # a toolchain at job time (taskforge-2675). go.mod's go 1.24.6 is
      # satisfied by the newer baked Go.
      - name: Verify baked Go
        run: go version

      - name: Run unit tests
        run: |
          go test -v -race -coverprofile=coverage-unit.out ./pkg/...

      - name: Run integration tests
        run: |
          make test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage-unit.out,./coverage-integration.out
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build
    runs-on: self-hosted-linux
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Go is baked into the self-hosted runner image; setup-go would download
      # a toolchain at job time (taskforge-2675). go.mod's go 1.24.6 is
      # satisfied by the newer baked Go.
      - name: Verify baked Go
        run: go version

      - name: Generate manifests
        run: make manifests generate

      - name: Build binary
        run: make build

      - name: Verify no changes
        run: |
          git diff --exit-code || (echo "Generated files are out of date. Run 'make manifests generate' and commit." && exit 1)

  docker:
    name: Docker Build
    runs-on: self-hosted-linux
    needs: [build]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write   # GitHub OIDC -> Vault (scoped Harbor robot)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keyless: GitHub OIDC -> Vault role gha-cnpg-storage-manager (bound to this repo AND
      # ref=refs/heads/master, so only a master push can log in) -> robot$cnpg-storage-manager-ci,
      # pull+push on the Harbor project cnpg-storage-manager only. Rotated weekly in Harbor and
      # read at runtime, so no repo secret to update. Provisioning: cluster-services
      # harbor/cnpg-storage-manager-ci-vault-seed.sh + vault/github-actions-oidc-cnpg-storage-manager-setup.sh.
      - name: Vault login (GitHub OIDC) -> Harbor robot
        if: github.ref == 'refs/heads/master'
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.support.tools
          method: jwt
          path: github-actions
          role: gha-cnpg-storage-manager
          jwtGithubAudience: https://github.com/SupportTools
          exportEnv: true
          secrets: |
            secret/data/harbor/cnpg-storage-manager-ci-robot username | HARBOR_ROBOT_USER ;
            secret/data/harbor/cnpg-storage-manager-ci-robot password | HARBOR_ROBOT_TOKEN

      - name: Login to Harbor
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ env.HARBOR_ROBOT_USER }}
          password: ${{ env.HARBOR_ROBOT_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            name=${{ env.HARBOR_IMAGE }},enable=${{ github.ref == 'refs/heads/master' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Harbor image evidence
        if: github.ref == 'refs/heads/master'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA::7}"
          got="$(docker buildx imagetools inspect "${HARBOR_IMAGE}:${sha}" --format '{{json .Manifest}}' | jq -r .digest)"
          [ "$got" = "$DIGEST" ] || { echo "::error::Harbor ${HARBOR_IMAGE}:${sha} is ${got}, want ${DIGEST}"; exit 1; }
          echo "Pushed ${HARBOR_IMAGE}:${sha}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"

  helm:
    name: Helm Lint
    runs-on: self-hosted-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # helm is baked into the runner image; no installer action or
      # get.helm.sh fallback (no job-time downloads, taskforge-2675).
      - name: Verify baked helm
        run: helm version --short

      - name: Lint Helm chart
        run: |
          if [ -d "charts/cnpg-storage-manager" ]; then
            helm lint charts/cnpg-storage-manager
          else
            echo "Helm chart not yet created, skipping lint"
          fi

  security:
    name: Security Scan
    runs-on: self-hosted-linux
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Go is baked into the self-hosted runner image; setup-go would download
      # a toolchain at job time (taskforge-2675). go.mod's go 1.24.6 is
      # satisfied by the newer baked Go.
      - name: Verify baked Go
        run: go version

      # gosec is baked into the runner image; securego/gosec@master pulled an
      # unpinned container image at job time (taskforge-2824).
      - name: Run Gosec Security Scanner
        run: gosec -version && gosec -no-fail -fmt sarif -out results.sarif ./...

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        if: always()
        continue-on-error: true  # Don't fail if GitHub Advanced Security is not enabled

  # The former `e2e` job here was gated on refs/heads/main while the default
  # branch is master, so it never ran; it also downloaded kind/kubectl via
  # helm/kind-action and a CNPG manifest from raw.githubusercontent.com at job
  # time. test-e2e.yml runs `make test-e2e` on every push and PR, so the job
  # was removed rather than re-enabled (taskforge-2824).
