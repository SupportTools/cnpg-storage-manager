name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: self-hosted-linux
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      # Go is baked into the self-hosted runner image; setup-go would download
      # a toolchain at job time (taskforge-2675). go.mod's go 1.24.6 is
      # satisfied by the newer baked Go.
      - name: Verify baked Go
        run: go version

      - name: Running Tests
        run: |
          go mod tidy
          make test
