name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: self-hosted-linux
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      # Go is baked into the self-hosted runner image; setup-go would download
      # a toolchain at job time (taskforge-2675). go.mod's go 1.24.6 is
      # satisfied by the newer baked Go.
      - name: Verify baked Go
        run: go version

      # golangci-lint is baked into the runner image (v2.12.2); the action
      # downloads it at job time (taskforge-2675).
      - name: Run linter
        run: golangci-lint version && golangci-lint run --timeout=5m
